name: Aptoide Crawl & Fetch

# Grows the Aptoide half of the catalog, straight into Supabase (leaf 5.l.iii.zi; was: a pull request of
# snapshot files). One run crawls up to `crawl.maxCandidates` candidates (config/aptoide-ingest.json, 10,000
# in at most 120 requests of 100), fetches and trust-checks up to `fetch.maxRequests` of them (1,500 at 1
# request per second, about 30 to 40 minutes), and WRITES the trusted ones to the `catalog_app` table
# (scripts/write-catalog-table.ts). Run it by hand ("Run workflow") until the table holds the target (leaf
# 5.l.iii.zo: about six more runs of 1,500 if the trust gate rejects nothing).
#
# Resume state: the crawl and fetch checkpoints and the candidate list are kept in the GitHub Actions cache
# (no pull request, nothing committed). A cache entry that is evicted (unused for 7 days) or missing means the
# next run crawls again from the top and refetches from the first candidate; it costs requests, not data,
# because the write is an upsert on `id`.
#
# PREREQUISITE: repo secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY, for the D-STORE project (never
# Zealot's). Without them the write step fails with a clear message AFTER the crawl and fetch; the cached
# results are kept and the next run writes them.

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aptoide-crawl
  cancel-in-progress: false

jobs:
  crawl-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Restore resume state
        uses: actions/cache/restore@v4
        with:
          path: |
            storage/downloads/aptoide-crawl-candidates.jsonl
            storage/downloads/aptoide-crawl-checkpoint.json
            storage/downloads/aptoide-meta-checkpoint.json
            storage/downloads/aptoide-meta-results.jsonl
          key: aptoide-state-${{ github.run_id }}
          restore-keys: aptoide-state-

      - name: Run Crawl (bounded chunks)
        run: npx tsx scripts/crawl-aptoide.ts

      - name: Run Fetch (getMeta)
        run: npx tsx scripts/fetch-aptoide-meta.ts

      - name: Write to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/write-catalog-table.ts

      - name: Save resume state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            storage/downloads/aptoide-crawl-candidates.jsonl
            storage/downloads/aptoide-crawl-checkpoint.json
            storage/downloads/aptoide-meta-checkpoint.json
            storage/downloads/aptoide-meta-results.jsonl
          key: aptoide-state-${{ github.run_id }}
